<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="100%" fill="none">
  <defs>
    <radialGradient id="footGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.16;0.28;0.16" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="footLine" x1="100" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <pattern id="footDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#30363D" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="900" height="90" rx="10" fill="#0D1117"/>
  <rect width="900" height="90" rx="10" fill="url(#footDots)"/>
  <rect width="900" height="90" rx="10" fill="url(#footGlow)"/>
  <rect x="100" y="18" width="700" height="1.5" rx="0.75" fill="url(#footLine)"/>
  <text x="450" y="52" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" letter-spacing="4">CODE  ·  CREATE  ·  INNOVATE  ·  EVOLVE</text>
  <text x="450" y="72" text-anchor="middle" fill="#7D8590" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" letter-spacing="1.5">ENZZO MARCHESOTTI · GITHUB PORTFOLIO</text>
</svg>
