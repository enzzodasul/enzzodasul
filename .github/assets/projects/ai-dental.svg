      <stop offset="100%" stop-color="#111C28"/>
    </linearGradient>
    <radialGradient id="glow3" cx="280" cy="75" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
