<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" width="100%" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="440" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#131926"/>
    </linearGradient>
    <radialGradient id="glow1" cx="310" cy="70" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route1" x1="60" y1="110" x2="380" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="440" height="150" rx="10" fill="url(#bg1)" stroke="#21262D" stroke-width="1"/>
  <rect width="440" height="150" rx="10" fill="url(#glow1)"/>
  <!-- Subtle map grid -->
  <g stroke="#21262D" stroke-width="0.7" opacity="0.6">
    <line x1="0" y1="30" x2="440" y2="30"/><line x1="0" y1="60" x2="440" y2="60"/>
    <line x1="0" y1="90" x2="440" y2="90"/><line x1="0" y1="120" x2="440" y2="120"/>
    <line x1="70" y1="0" x2="70" y2="150"/><line x1="140" y1="0" x2="140" y2="150"/>
    <line x1="210" y1="0" x2="210" y2="150"/><line x1="280" y1="0" x2="280" y2="150"/>
    <line x1="350" y1="0" x2="350" y2="150"/>
  </g>
  <!-- Stylized delivery route -->
  <path d="M55 112 C110 112, 130 48, 205 64 C265 76, 290 36, 365 44" stroke="url(#route1)" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <!-- Origin node -->
  <circle cx="55" cy="112" r="5" fill="#7C3AED"/>
  <circle cx="55" cy="112" r="10" stroke="#7C3AED" stroke-width="1" opacity="0.45"/>
  <!-- Midpoint node -->
  <circle cx="205" cy="64" r="4.5" fill="#A78BFA"/>
  <!-- Destination radar pulse -->
  <circle cx="365" cy="44" r="18" stroke="#06B6D4" stroke-width="1" opacity="0.25"/>
  <circle cx="365" cy="44" r="11" stroke="#06B6D4" stroke-width="1.2" opacity="0.5"/>
  <circle cx="365" cy="44" r="5" fill="#06B6D4"/>
  <!-- Label pill -->
  <rect x="20" y="18" width="118" height="22" rx="11" fill="#161B22" stroke="#30363D" stroke-width="0.8"/>
  <circle cx="33" cy="29" r="3" fill="#06B6D4"/>
  <text x="42" y="33" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="600" letter-spacing="0.8">LOGISTICS · API</text>
</svg>
