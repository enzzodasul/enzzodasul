<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" fill="none">
  <defs>
    <linearGradient id="heroBase" x1="0" y1="0" x2="900" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D14"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B101B"/>
    </linearGradient>
    <radialGradient id="auraViolet" cx="28%" cy="35%" r="42%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.28">
        <animate attributeName="stop-opacity" values="0.22;0.34;0.22" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraCyan" cx="74%" cy="45%" r="38%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.16;0.28;0.16" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="65%" stop-color="#0E7490" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="120" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="1"/>
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#30363D" opacity="0.55"/>
    </pattern>
    <linearGradient id="bottomFade" x1="0" y1="180" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Base & Aura Backgrounds -->
  <rect width="900" height="250" rx="12" fill="url(#heroBase)"/>
  <rect width="900" height="250" rx="12" fill="url(#dotGrid)"/>
  <rect width="900" height="250" rx="12" fill="url(#auraViolet)"/>
  <rect width="900" height="250" rx="12" fill="url(#auraCyan)"/>

  <!-- Subtle Geometric Orbit Rings -->
  <circle cx="450" cy="125" r="190" stroke="#7C3AED" stroke-width="0.6" stroke-dasharray="4 8" opacity="0.22">
    <animateTransform attributeName="transform" type="rotate" from="0 450 125" to="360 450 125" dur="60s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="125" r="135" stroke="#06B6D4" stroke-width="0.6" stroke-dasharray="3 10" opacity="0.18">
    <animateTransform attributeName="transform" type="rotate" from="360 450 125" to="0 450 125" dur="45s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Animated Particles -->
  <circle cx="165" cy="68" r="2.2" fill="#A78BFA" opacity="0.7">
    <animate attributeName="cy" values="68;56;68" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="735" cy="82" r="2.5" fill="#06B6D4" opacity="0.7">
    <animate attributeName="cy" values="82;94;82" dur="5.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="5.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="175" r="1.8" fill="#06B6D4" opacity="0.6">
    <animate attributeName="cy" values="175;164;175" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="675" cy="168" r="2" fill="#A78BFA" opacity="0.6">
    <animate attributeName="cy" values="168;156;168" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Status Pill -->
  <rect x="352" y="42" width="196" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="368" cy="54" r="3.5" fill="#06B6D4">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="458" y="57.5" text-anchor="middle" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.4">BUILDING &amp; SHIPPING</text>

  <!-- Main Editorial Typography -->
  <text x="450" y="124" text-anchor="middle" fill="#F0F6FC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="42" letter-spacing="5">ENZZO MARCHESOTTI</text>
  <text x="450" y="156" text-anchor="middle" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="500" font-size="13.5" letter-spacing="4">FULL STACK DEVELOPER  ·  BRAZIL</text>

  <!-- Bottom Fade & Glowing Horizon Line -->
  <rect width="900" height="250" rx="12" fill="url(#bottomFade)"/>
  <rect x="120" y="204" width="660" height="1.5" rx="0.75" fill="url(#accentLine)"/>
  <rect width="899" height="249" x="0.5" y="0.5" rx="11.5" stroke="#21262D" stroke-width="1"/>
</svg>
