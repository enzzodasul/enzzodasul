name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/update-stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests
        run: node --test .github/scripts/update-stats.test.mjs

      - name: Generate dynamic GitHub stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-stats.mjs

      - name: Commit and push updated stats if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/stats-dark.svg .github/assets/stats-light.svg .github/assets/stats-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update dynamic GitHub stats [skip ci]"
            git push
          else
            echo "No stats changes to commit."
          fi
